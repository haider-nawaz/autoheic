name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck \
            bin/autoheic \
            bin/heic-convert-one \
            bin/lib/common.sh \
            install.sh \
            uninstall.sh

  applescript:
    name: applescript syntax
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substitute token + compile
        run: |
          sed "s|__CONVERTER_PATH__|/tmp/dummy-converter|g" \
              applescript/autoheic-trigger.applescript > /tmp/at.applescript
          osacompile -o /tmp/at.scpt /tmp/at.applescript

  install-dry-run:
    name: install.sh dry-run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the installer
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          ./install.sh --folders=downloads --format=jpeg --quality=95 --yes --dry-run
