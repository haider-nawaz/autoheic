# autoheic configuration
# This file is shell-sourceable. Lines starting with # are comments.
# Edit values below, or use: autoheic config set <key>=<value>

# Output format: jpeg | png | tiff | webp
AUTOHEIC_FORMAT="jpeg"

# Output quality, 0–100. Only used for lossy formats (jpeg, webp).
# Higher = better quality, larger file. 95 is visually indistinguishable from 100.
AUTOHEIC_QUALITY=95

# Keep the original .heic after conversion? 0 = delete, 1 = keep.
AUTOHEIC_KEEP_ORIGINAL=0

# Where conversion events are logged.
AUTOHEIC_LOG="$HOME/Library/Logs/autoheic.log"
